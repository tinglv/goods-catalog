<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Here Store 商品展示</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f6f6f6; color: #333; padding-bottom: 80px; }
    
    header { background: #07c160; color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    header h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .search-box { width: 100%; max-width: 500px; padding: 8px 14px; border: none; border-radius: 20px; font-size: 14px; outline: none; }

    .category-bar { display: flex; overflow-x: auto; background: white; padding: 10px; gap: 8px; border-bottom: 1px solid #eee; position: sticky; top: 73px; z-index: 99; }
    .category-item { padding: 5px 12px; background: #f0f0f0; border-radius: 14px; font-size: 13px; color: #666; white-space: nowrap; cursor: pointer; }
    .category-item.active { background: #07c160; color: white; font-weight: bold; }

    .goods-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; max-width: 800px; margin: 0 auto; }
    .goods-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.04); display: flex; flex-direction: column; justify-content: space-between; }
    .goods-img { width: 100%; height: 150px; object-fit: cover; }
    .goods-info { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .goods-title { font-size: 14px; font-weight: bold; line-height: 1.3; margin-bottom: 6px; color: #222; }
    .goods-price { color: #fa5151; font-size: 16px; font-weight: 700; margin-bottom: 8px; }

    /* 卡片上的规格展示样式 */
    .card-spec-section { margin-bottom: 10px; background: #fafafa; padding: 6px; border-radius: 6px; }
    .card-spec-group { margin-bottom: 6px; }
    .card-spec-group:last-child { margin-bottom: 0; }
    .card-spec-title { font-size: 11px; color: #888; margin-bottom: 4px; }
    .card-spec-items { display: flex; flex-wrap: wrap; gap: 4px; }
    .card-spec-btn { padding: 3px 8px; border: 1px solid #e0e0e0; border-radius: 4px; font-size: 11px; background: white; color: #444; cursor: pointer; transition: all 0.15s ease; }
    .card-spec-btn.selected { border-color: #07c160; color: #07c160; background: #f0f9f4; font-weight: bold; }

    .card-actions { display: flex; gap: 6px; }
    .btn-cart { flex: 1; background: #e8f7ee; color: #07c160; border: none; padding: 7px 0; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .btn-buy { flex: 1; background: #07c160; color: white; border: none; padding: 7px 0; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }

    /* 悬浮购物车按钮 */
    .cart-float-btn { position: fixed; right: 20px; bottom: 20px; background: #ff5000; color: white; width: 56px; height: 56px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(255,80,0,0.4); cursor: pointer; z-index: 1000; }
    .cart-float-btn .icon { font-size: 20px; line-height: 1; }
    .cart-float-btn .text { font-size: 10px; margin-top: 2px; }
    .cart-badge { position: absolute; top: -2px; right: -2px; background: #fa5151; color: white; border-radius: 10px; padding: 2px 6px; font-size: 11px; font-weight: bold; border: 2px solid white; }

    /* 弹窗通用样式 */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: flex-end; z-index: 1001; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: white; width: 100%; max-width: 600px; border-radius: 16px 16px 0 0; max-height: 85vh; overflow-y: auto; padding: 20px; position: relative; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .close-btn { position: absolute; right: 15px; top: 15px; font-size: 24px; color: #999; cursor: pointer; line-height: 1; }

    /* 购物车列表 */
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
    .cart-item-title { font-size: 14px; font-weight: bold; }
    .cart-item-spec { font-size: 12px; color: #888; margin-top: 2px; }
    .cart-item-price { color: #fa5151; font-size: 14px; font-weight: bold; margin-top: 2px; }
    .cart-item-control { display: flex; align-items: center; gap: 8px; }
    .btn-qty { width: 26px; height: 26px; border: 1px solid #ddd; background: #f9f9f9; border-radius: 4px; font-weight: bold; cursor: pointer; }

    .btn-submit-order { width: 100%; background: #07c160; color: white; border: none; padding: 12px 0; border-radius: 25px; font-size: 15px; font-weight: bold; margin-top: 15px; cursor: pointer; }

    /* 二维码弹窗 */
    .qr-box { text-align: center; padding: 10px 0; }
    .qr-img { width: 200px; height: 200px; margin: 10px auto; display: block; border: 1px solid #eee; }
  </style>
</head>
<body>

  <header>
    <h1>The Here Store 商品展示目录</h1>
    <input type="text" class="search-box" id="searchInput" placeholder="搜索商品..." oninput="filterGoods()">
  </header>

  <div class="category-bar" id="categoryBar">
    <div class="category-item active" onclick="selectCategory('全部')">全部</div>
  </div>

  <div class="goods-list" id="goodsList"></div>

  <!-- 悬浮购物车按钮 -->
  <div class="cart-float-btn" onclick="openCartModal()">
    <span class="icon">🛒</span>
    <span class="text">购物车</span>
    <span class="cart-badge" id="cartBadge">0</span>
  </div>

  <!-- 购物车弹窗 -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('cartModal')">&times;</span>
      <h3 style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">已选商品清单</h3>
      <div id="cartItemsList"></div>
      <div style="margin-top: 15px; padding-top: 10px; border-top: 2px solid #eee; display: flex; justify-content: space-between; align-items: center;">
        <span>合计预估：</span>
        <span style="color: #fa5151; font-size: 18px; font-weight: bold;" id="cartTotalPrice">￥0</span>
      </div>
      <button class="btn-submit-order" onclick="submitCartOrder()">复制订单并联系店主购买</button>
    </div>
  </div>

  <!-- 微信客服/付款弹窗 -->
  <div class="modal-overlay" id="qrModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('qrModal')">&times;</span>
      <div class="qr-box">
        <h3 style="color: #07c160; margin-bottom: 8px;">订单信息已复制！</h3>
        <p style="font-size: 13px; color: #666;">请在微信中粘贴发送给店主，长按扫描二维码添加微信：</p>
        <img id="ownerQr" class="qr-img" src="./wechat.png" alt="微信二维码">
        <p style="font-size: 14px; font-weight: bold;">微信号：<span id="wechatIdText">-Oo1998oO-</span></p>
      </div>
    </div>
  </div>

  <script>
    // 配置个人微信信息
    const WECHAT_ID = "-Oo1998oO-"; 
    const QR_CODE_URL = "./wechat.png"; // 二维码图片相对路径

    let allGoods = [];
    let currentCategory = '全部';
    let cardSelectedOptions = {}; 
    let cart = [];

    // 初始化获取商品数据
    fetch('goods.json')
      .then(res => res.json())
      .then(data => {
        allGoods = data;
        allGoods.forEach(good => {
          cardSelectedOptions[good.id] = {};
          if (good.options && good.options.length > 0) {
            good.options.forEach(opt => {
              const firstVal = typeof opt.values[0] === 'object' ? opt.values[0].name : opt.values[0];
              cardSelectedOptions[good.id][opt.name] = firstVal;
            });
          }
        });
        renderCategories();
        renderGoods();
      })
      .catch(err => {
        console.error("数据加载出错:", err);
      });

    function renderCategories() {
      const categories = ['全部', ...new Set(allGoods.map(item => item.category))];
      document.getElementById('categoryBar').innerHTML = categories.map(cat => `
        <div class="category-item ${cat === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</div>
      `).join('');
    }

    // 列表渲染
    function renderGoods() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const list = document.getElementById('goodsList');

      const filtered = allGoods.filter(item => {
        const matchCategory = currentCategory === '全部' || item.category === currentCategory;
        const matchSearch = item.title.toLowerCase().includes(keyword) || (item.desc && item.desc.toLowerCase().includes(keyword));
        return matchCategory && matchSearch;
      });

      if (filtered.length === 0) {
        list.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999; padding: 30px;">未找到商品</p>';
        return;
      }

      list.innerHTML = filtered.map(good => {
        const selectedSpecs = cardSelectedOptions[good.id] || {};
        const displayPrice = getDynamicPrice(good, selectedSpecs);

        let specHtml = '';
        if (good.options && good.options.length > 0) {
          specHtml = `<div class="card-spec-section">` + good.options.map(opt => `
            <div class="card-spec-group" data-opt-name="${opt.name}">
              <div class="card-spec-title">${opt.name}:</div>
              <div class="card-spec-items">
                ${opt.values.map(val => {
                  const valName = typeof val === 'object' ? val.name : val;
                  const isSelected = selectedSpecs[opt.name] === valName;
                  return `<button class="card-spec-btn ${isSelected ? 'selected' : ''}" onclick="event.stopPropagation(); changeCardSpec(this, ${good.id}, '${opt.name}', '${valName}')">${valName}</button>`;
                }).join('')}
              </div>
            </div>
          `).join('') + `</div>`;
        }

        return `
          <div class="goods-card" id="goods-card-${good.id}">
            <img class="goods-img" src="${good.image}" alt="${good.title}">
            <div class="goods-info">
              <div>
                <div class="goods-title">${good.title}</div>
                <div class="goods-price">${displayPrice}</div>
                ${specHtml}
              </div>
              <div class="card-actions">
                <button class="btn-cart" onclick="addCardToCart(${good.id})">+ 购物车</button>
                <button class="btn-buy" onclick="buyCardNow(${good.id})">直接购买</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 核心优化：局部无缝刷新规格选中状态与价格
    function changeCardSpec(btnEl, goodId, specName, valName) {
      // 1. 更新数据模型
      cardSelectedOptions[goodId][specName] = valName;
      
      // 2. 精准定位当前商品卡片
      const cardEl = document.getElementById(`goods-card-${goodId}`);
      if (!cardEl) return;

      // 3. 仅切换当前规格组的按钮高亮（无重绘/不闪屏）
      const groupEl = btnEl.closest('.card-spec-group');
      if (groupEl) {
        groupEl.querySelectorAll('.card-spec-btn').forEach(btn => btn.classList.remove('selected'));
        btnEl.classList.add('selected');
      }

      // 4. 仅更新当前卡片上的价格
      const good = allGoods.find(g => g.id === goodId);
      const newPrice = getDynamicPrice(good, cardSelectedOptions[goodId]);
      const priceEl = cardEl.querySelector('.goods-price');
      if (priceEl) {
        priceEl.innerText = newPrice;
      }
    }

    function getDynamicPrice(good, selectedSpecs) {
      if (!good.options) return good.price;
      for (let opt of good.options) {
        for (let val of opt.values) {
          if (typeof val === 'object' && selectedSpecs[opt.name] === val.name && val.price) {
            return `￥${val.price}`;
          }
        }
      }
      return good.price;
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderGoods();
    }

    function filterGoods() {
      renderGoods();
    }

    function addCardToCart(goodId) {
      const good = allGoods.find(g => g.id === goodId);
      const selectedSpecs = cardSelectedOptions[goodId] || {};
      const specText = Object.keys(selectedSpecs).length > 0 
        ? Object.entries(selectedSpecs).map(([k, v]) => `${k}:${v}`).join('; ') 
        : '标准规格';
      const price = getDynamicPrice(good, selectedSpecs);

      const exist = cart.find(item => item.good.id === good.id && item.specText === specText);
      if (exist) {
        exist.qty += 1;
      } else {
        cart.push({ good, specText, price, qty: 1 });
      }

      updateCartBadge();
      alert(`已添加：${good.title} (${specText})`);
    }

    function buyCardNow(goodId) {
      addCardToCart(goodId);
      openCartModal();
    }

    function updateCartBadge() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartBadge').innerText = totalCount;
    }

    function openCartModal() {
      renderCartItems();
      document.getElementById('cartModal').classList.add('active');
    }

    function parseNumberPrice(priceStr) {
      if (!priceStr) return 0;
      const match = priceStr.match(/\d+(\.\d+)?/);
      return match ? parseFloat(match[0]) : 0;
    }

    function renderCartItems() {
      const container = document.getElementById('cartItemsList');
      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">购物车为空</p>';
        document.getElementById('cartTotalPrice').innerText = '￥0';
        return;
      }

      let total = 0;
      container.innerHTML = cart.map((item, idx) => {
        const numPrice = parseNumberPrice(item.price);
        total += numPrice * item.qty;

        return `
          <div class="cart-item">
            <div>
              <div class="cart-item-title">${item.good.title}</div>
              <div class="cart-item-spec">${item.specText}</div>
              <div class="cart-item-price">${item.price}</div>
            </div>
            <div class="cart-item-control">
              <button class="btn-qty" onclick="changeQty(${idx}, -1)">-</button>
              <span>${item.qty}</span>
              <button class="btn-qty" onclick="changeQty(${idx}, 1)">+</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cartTotalPrice').innerText = `￥${total.toFixed(2)}`;
    }

    function changeQty(idx, change) {
      cart[idx].qty += change;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      updateCartBadge();
      renderCartItems();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function submitCartOrder() {
      if (cart.length === 0) return;

      let orderText = `【微信下单列表】\n------------------\n`;
      let total = 0;

      cart.forEach((item, i) => {
        orderText += `${i + 1}. ${item.good.title}\n   规格: ${item.specText}\n   价格: ${item.price} x ${item.qty}件\n`;
        total += parseNumberPrice(item.price) * item.qty;
      });

      orderText += `------------------\n预估总计：￥${total.toFixed(2)}\n\n请确认是否有货，谢谢！`;

      navigator.clipboard.writeText(orderText).then(() => {
        closeModal('cartModal');
        document.getElementById('wechatIdText').innerText = WECHAT_ID;
        document.getElementById('ownerQr').src = QR_CODE_URL;
        document.getElementById('qrModal').classList.add('active');
      }).catch(() => alert('订单已生成，请直接截屏发送给店主。'));
    }
  </script>
</body>
</html>
