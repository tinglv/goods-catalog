<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>店主精选 - 商品目录</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased font-sans pb-20">

    <!-- 顶部导航 -->
    <header class="bg-white sticky top-0 z-30 shadow-sm border-b border-gray-100">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-red-500 text-white flex items-center justify-center font-bold text-lg shadow">
                    店
                </div>
                <div>
                    <h1 class="font-bold text-base text-gray-900 leading-tight">微商精选小店</h1>
                    <p class="text-xs text-gray-500">挑选心仪商品，联系店主直接购买</p>
                </div>
            </div>
            <button onclick="openContactModal()" class="bg-red-50 text-red-600 text-xs px-3 py-1.5 rounded-full font-medium border border-red-200 hover:bg-red-100 transition">
                联系店主
            </button>
        </div>

        <!-- 搜索与分类栏 -->
        <div class="max-w-md mx-auto px-4 pb-3">
            <div class="relative my-2">
                <input type="text" id="searchInput" placeholder="搜索商品名称或关键词..." 
                       class="w-full bg-gray-100 text-sm pl-9 pr-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400">
                <svg class="w-4 h-4 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            
            <div id="categoryContainer" class="flex space-x-2 overflow-x-auto no-scrollbar py-1"></div>
        </div>
    </header>

    <!-- 主体：商品列表 -->
    <main class="max-w-md mx-auto px-3 pt-3">
        <div id="goodsGrid" class="grid grid-cols-2 gap-2.5"></div>
        <div id="emptyState" class="hidden text-center py-12">
            <p class="text-gray-400 text-sm">暂无符合条件的商品</p>
        </div>
    </main>

    <!-- 商品详情与规格弹窗 -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end justify-center sm:items-center">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto relative">
            <button onclick="closeDetailModal()" class="absolute right-3 top-3 z-10 bg-black/40 text-white w-7 h-7 rounded-full flex items-center justify-center">✕</button>
            
            <div class="w-full h-64 bg-gray-100 relative">
                <img id="modalImage" src="" alt="" class="w-full h-full object-cover">
            </div>

            <div class="p-4">
                <div class="flex justify-between items-baseline mb-1">
                    <span id="modalPrice" class="text-2xl font-bold text-red-600"></span>
                    <span id="modalCategory" class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded"></span>
                </div>
                <h2 id="modalTitle" class="text-base font-bold text-gray-900 mb-3"></h2>
                
                <!-- 规格选择区域 -->
                <div id="optionsContainer" class="space-y-3 my-4 border-t border-b border-gray-100 py-3"></div>

                <div class="mb-6">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">商品介绍</h3>
                    <p id="modalDesc" class="text-sm text-gray-600 whitespace-pre-line leading-relaxed"></p>
                </div>

                <button onclick="copyOrderDetailsAndShowQR()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-red-200 transition flex items-center justify-center space-x-2">
                    <span>复制规格并联系店主购买</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 联系店主 / 收款二维码弹窗 -->
    <div id="contactModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-2xl p-5 text-center relative">
            <button onclick="closeContactModal()" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">✕</button>
            <h3 class="text-base font-bold text-gray-900 mb-1">联系店主购买</h3>
            <p class="text-xs text-gray-500 mb-3">已自动复制意向规格信息，请发送给店主</p>

            <div class="w-48 h-48 mx-auto bg-gray-100 rounded-lg mb-3 overflow-hidden border">
                <img id="qrImage" src="" alt="店主二维码" class="w-full h-full object-cover">
            </div>

            <div class="bg-gray-50 p-2 rounded-lg mb-3 text-left text-xs text-gray-600 space-y-1">
                <p><span class="text-gray-400">微信号：</span><span id="wechatIdText" class="font-bold text-gray-800"></span></p>
                <p id="selectedInfoPreview" class="text-red-600 font-medium line-clamp-2"></p>
            </div>

            <button onclick="copyWechatIdOnly()" class="w-full bg-gray-900 text-white text-xs font-medium py-2.5 rounded-lg hover:bg-black transition">
                仅复制微信号
            </button>
        </div>
    </div>

    <!-- Toast 提示框 -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-black/80 text-white text-xs px-4 py-2 rounded-full z-50 hidden"></div>

    <script>
        const WECHAT_ID = "wx_shop_owner"; // 替换为你的真实微信号
        const QR_CODE_URL = "https://via.placeholder.com/300x300?text=WeChat+QR"; // 替换为你的二维码图片

        let allGoods = [];
        let currentCategory = "全部";
        let activeItem = null;
        let selectedOptions = {};

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("wechatIdText").innerText = WECHAT_ID;
            document.getElementById("qrImage").src = QR_CODE_URL;
            fetchGoodsData();
            document.getElementById("searchInput").addEventListener("input", filterGoods);
        });

        async function fetchGoodsData() {
            try {
                const res = await fetch('goods.json');
                allGoods = await res.json();
                renderCategories();
                renderGoods(allGoods);
            } catch (err) {
                console.error("加载商品数据失败:", err);
            }
        }

        function renderCategories() {
            const categories = ["全部", ...new Set(allGoods.map(item => item.category))];
            const container = document.getElementById("categoryContainer");
            container.innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat}')" 
                        class="px-3 py-1 rounded-full text-xs whitespace-nowrap transition ${
                            cat === currentCategory ? 'bg-red-600 text-white font-medium' : 'bg-gray-100 text-gray-600'
                        }">${cat}</button>
            `).join('');
        }

        function selectCategory(cat) {
            currentCategory = cat;
            renderCategories();
            filterGoods();
        }

        function filterGoods() {
            const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
            const filtered = allGoods.filter(item => {
                const matchCategory = currentCategory === "全部" || item.category === currentCategory;
                const matchKeyword = item.title.toLowerCase().includes(keyword) || item.desc.toLowerCase().includes(keyword);
                return matchCategory && matchKeyword;
            });
            renderGoods(filtered);
        }

        function renderGoods(goodsList) {
            const grid = document.getElementById("goodsGrid");
            const empty = document.getElementById("emptyState");
            if (goodsList.length === 0) {
                grid.innerHTML = "";
                empty.classList.remove("hidden");
                return;
            }
            empty.classList.add("hidden");
            grid.innerHTML = goodsList.map(item => `
                <div onclick="openDetailModal(${item.id})" class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 flex flex-col cursor-pointer active:scale-95 transition-transform">
                    <div class="h-36 w-full bg-gray-50">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-2.5 flex-1 flex flex-col justify-between">
                        <h3 class="text-xs font-bold text-gray-800 line-clamp-2 mb-1">${item.title}</h3>
                        <div class="flex items-baseline justify-between mt-2">
                            <span class="text-sm font-bold text-red-600">￥${item.price}</span>
                            <span class="text-[10px] bg-red-50 text-red-500 px-1.5 py-0.5 rounded">选规格</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openDetailModal(id) {
            activeItem = allGoods.find(g => g.id === id);
            if (!activeItem) return;

            selectedOptions = {};
            document.getElementById("modalImage").src = activeItem.image;
            document.getElementById("modalTitle").innerText = activeItem.title;
            document.getElementById("modalPrice").innerText = `￥${activeItem.price}`;
            document.getElementById("modalCategory").innerText = activeItem.category;
            document.getElementById("modalDesc").innerText = activeItem.desc;

            // 渲染规格选择项
            const container = document.getElementById("optionsContainer");
            if (activeItem.options && activeItem.options.length > 0) {
                container.innerHTML = activeItem.options.map(opt => {
                    // 默认选择第一个选项
                    selectedOptions[opt.name] = opt.values[0];
                    return `
                        <div>
                            <label class="text-xs font-bold text-gray-700 block mb-1.5">${opt.name}</label>
                            <div class="flex flex-wrap gap-2">
                                ${opt.values.map(val => `
                                    <button type="button" 
                                            onclick="selectOption('${opt.name}', '${val}')" 
                                            id="opt-${opt.name}-${val}"
                                            class="opt-btn-${opt.name} text-xs px-3 py-1.5 rounded-lg border border-gray-200 text-gray-700 hover:border-red-500 transition">
                                        ${val}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }).join('');

                // 高亮默认选中项
                Object.keys(selectedOptions).forEach(optName => {
                    updateOptionUI(optName, selectedOptions[optName]);
                });
            } else {
                container.innerHTML = "";
            }

            document.getElementById("detailModal").classList.remove("hidden");
        }

        function selectOption(optName, val) {
            selectedOptions[optName] = val;
            updateOptionUI(optName, val);
        }

        function updateOptionUI(optName, selectedVal) {
            const btns = document.querySelectorAll(`.opt-btn-${optName}`);
            btns.forEach(btn => {
                btn.classList.remove('border-red-500', 'bg-red-50', 'text-red-600', 'font-medium');
                btn.classList.add('border-gray-200', 'text-gray-700');
            });

            const activeBtn = document.getElementById(`opt-${optName}-${selectedVal}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-gray-200', 'text-gray-700');
                activeBtn.classList.add('border-red-500', 'bg-red-50', 'text-red-600', 'font-medium');
            }
        }

        function closeDetailModal() {
            document.getElementById("detailModal").classList.add("hidden");
        }

        function openContactModal() {
            document.getElementById("contactModal").classList.remove("hidden");
        }

        function closeContactModal() {
            document.getElementById("contactModal").classList.add("hidden");
        }

        function copyOrderDetailsAndShowQR() {
            if (!activeItem) return;

            let specText = Object.entries(selectedOptions)
                .map(([k, v]) => `${k}:${v}`)
                .join(" / ");
            
            const copyContent = `想买：【${activeItem.title}】\n价格：￥${activeItem.price}\n规格：${specText || '默认'}\n微信号：${WECHAT_ID}`;

            navigator.clipboard.writeText(copyContent).then(() => {
                showToast("商品及规格信息已复制！");
            }).catch(() => {
                showToast("已为你准备好微信名片");
            });

            document.getElementById("selectedInfoPreview").innerText = `已选：${activeItem.title} (${specText || '标准'})`;
            closeDetailModal();
            openContactModal();
        }

        function copyWechatIdOnly() {
            navigator.clipboard.writeText(WECHAT_ID).then(() => {
                showToast("微信号复制成功！");
            });
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.classList.remove("hidden");
            setTimeout(() => toast.classList.add("hidden"), 2200);
        }
    </script>
</body>
</html>
