<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Here Store - 精选目录</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f2eb; color: #2d2926; padding-bottom: 80px; }
    
    /* 顶部导航栏 - 复古墨绿 */
    header { background: #4a5b46; color: #f7f5f0; padding: 16px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(45,41,38,0.12); }
    header h1 { font-size: 19px; font-weight: 500; letter-spacing: 1px; margin-bottom: 10px; font-family: "Georgia", serif, sans-serif; }
    .search-box { width: 100%; max-width: 500px; padding: 8px 16px; border: 1px solid #3c4a38; border-radius: 20px; font-size: 13px; outline: none; background: rgba(255,255,255,0.95); color: #2d2926; }
    .search-box::placeholder { color: #888; }

    /* 分类栏 - 大地暖米色 */
    .category-bar { display: flex; overflow-x: auto; background: #ebdccb; padding: 10px 12px; gap: 8px; border-bottom: 1px solid #dfcfbc; position: sticky; top: 76px; z-index: 99; }
    .category-item { padding: 5px 14px; background: #fdfcf9; border-radius: 16px; font-size: 12px; color: #5a4f43; white-space: nowrap; cursor: pointer; border: 1px solid #dcd1c2; transition: all 0.2s; }
    .category-item.active { background: #4a5b46; color: #f7f5f0; border-color: #4a5b46; font-weight: 600; }

    /* 商品列表网格 */
    .goods-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; max-width: 800px; margin: 0 auto; }
    .goods-card { background: #fdfcf9; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #eee8dd; display: flex; flex-direction: column; justify-content: space-between; }
    .goods-img { width: 100%; height: 155px; object-fit: cover; }
    .goods-info { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .goods-title { font-size: 14px; font-weight: 600; line-height: 1.35; margin-bottom: 6px; color: #2d2926; }
    .goods-price { color: #8c3b2b; font-size: 16px; font-weight: 700; margin-bottom: 8px; font-family: "Georgia", serif, sans-serif; }

    /* 卡片规格区域 */
    .card-spec-section { margin-bottom: 10px; background: #f7f3eb; padding: 6px 8px; border-radius: 6px; border: 1px dashed #e2d9cb; }
    .card-spec-group { margin-bottom: 6px; }
    .card-spec-group:last-child { margin-bottom: 0; }
    .card-spec-title { font-size: 11px; color: #7a6e60; margin-bottom: 4px; }
    .card-spec-items { display: flex; flex-wrap: wrap; gap: 4px; }
    .card-spec-btn { padding: 3px 8px; border: 1px solid #d3c7b7; border-radius: 4px; font-size: 11px; background: #ffffff; color: #4a4035; cursor: pointer; transition: all 0.15s ease; }
    .card-spec-btn.selected { border-color: #8c3b2b; color: #8c3b2b; background: #fbf2f0; font-weight: bold; }

    /* 按钮组 */
    .card-actions { display: flex; gap: 6px; }
    .btn-cart { flex: 1; background: #e6edd2; color: #3b4d37; border: 1px solid #cad6a9; padding: 7px 0; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-buy { flex: 1; background: #8c3b2b; color: #ffffff; border: none; padding: 7px 0; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }

    /* 悬浮购物车 */
    .cart-float-btn { position: fixed; right: 20px; bottom: 20px; background: #8c3b2b; color: #ffffff; width: 56px; height: 56px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(140,59,43,0.35); cursor: pointer; z-index: 1000; }
    .cart-float-btn .icon { font-size: 20px; line-height: 1; }
    .cart-float-btn .text { font-size: 10px; margin-top: 2px; }
    .cart-badge { position: absolute; top: -2px; right: -2px; background: #4a5b46; color: white; border-radius: 10px; padding: 2px 6px; font-size: 11px; font-weight: bold; border: 2px solid #ffffff; }

    /* 优雅 Toast 轻提示 */
    .toast-msg {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(45, 41, 38, 0.92);
      color: #f7f5f0;
      padding: 12px 22px;
      border-radius: 25px;
      font-size: 13px;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      backdrop-filter: blur(4px);
      text-align: center;
      max-width: 80%;
      line-height: 1.4;
    }
    .toast-msg.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* 弹窗通用样式 */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30,25,20,0.65); display: none; justify-content: center; align-items: flex-end; z-index: 1001; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #fdfcf9; width: 100%; max-width: 600px; border-radius: 16px 16px 0 0; max-height: 85vh; overflow-y: auto; padding: 20px; position: relative; animation: slideUp 0.3s ease-out; border-top: 3px solid #4a5b46; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .close-btn { position: absolute; right: 15px; top: 15px; font-size: 24px; color: #888; cursor: pointer; line-height: 1; }

    /* 购物车列表 */
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0e8dc; }
    .cart-item-title { font-size: 14px; font-weight: bold; color: #2d2926; }
    .cart-item-spec { font-size: 12px; color: #7a6e60; margin-top: 2px; }
    .cart-item-price { color: #8c3b2b; font-size: 14px; font-weight: bold; margin-top: 2px; }
    .cart-item-control { display: flex; align-items: center; gap: 8px; }
    .btn-qty { width: 26px; height: 26px; border: 1px solid #d3c7b7; background: #f7f3eb; border-radius: 4px; font-weight: bold; color: #4a4035; cursor: pointer; }

    .btn-submit-order { width: 100%; background: #4a5b46; color: #f7f5f0; border: none; padding: 12px 0; border-radius: 25px; font-size: 15px; font-weight: bold; margin-top: 15px; cursor: pointer; }

    /* 二维码弹窗 */
    .qr-box { text-align: center; padding: 10px 0; }
    .qr-img { width: 200px; height: 200px; margin: 10px auto; display: block; border: 1px solid #e0d8cb; border-radius: 8px; }
  </style>
</head>
<body>

  <header>
    <h1>The Here Store</h1>
    <input type="text" class="search-box" id="searchInput" placeholder="搜索商品名称..." oninput="filterGoods()">
  </header>

  <div class="category-bar" id="categoryBar">
    <div class="category-item active" onclick="selectCategory('全部')">全部</div>
  </div>

  <div class="goods-list" id="goodsList"></div>

  <!-- 悬浮购物车按钮 -->
  <div class="cart-float-btn" onclick="openCartModal()">
    <span class="icon">🛒</span>
    <span class="text">清单</span>
    <span class="cart-badge" id="cartBadge">0</span>
  </div>

  <!-- Toast轻提示组件 -->
  <div id="toast" class="toast-msg"></div>

  <!-- 购物车弹窗 -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('cartModal')">&times;</span>
      <h3 style="margin-bottom: 15px; border-bottom: 1px solid #eae2d5; padding-bottom: 10px; color: #2d2926;">已选商品清单</h3>
      <div id="cartItemsList"></div>
      <div style="margin-top: 15px; padding-top: 10px; border-top: 2px solid #eae2d5; display: flex; justify-content: space-between; align-items: center;">
        <span>合计预估：</span>
        <span style="color: #8c3b2b; font-size: 18px; font-weight: bold;" id="cartTotalPrice">￥0</span>
      </div>
      <button class="btn-submit-order" onclick="submitCartOrder()">复制订单并联系店主购买</button>
    </div>
  </div>

  <!-- 微信客服/付款弹窗 -->
  <div class="modal-overlay" id="qrModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('qrModal')">&times;</span>
      <div class="qr-box">
        <h3 style="color: #4a5b46; margin-bottom: 8px;">订单信息已复制！</h3>
        <p style="font-size: 13px; color: #666;">请在微信中粘贴发送给店主，长按扫描二维码添加微信：</p>
        <img id="ownerQr" class="qr-img" src="" alt="微信二维码">
        <p style="font-size: 14px; font-weight: bold; margin-top: 8px; color: #2d2926;">微信号：<span id="wechatIdText"></span></p>
      </div>
    </div>
  </div>

  <script>
    const WECHAT_ID = "-Oo1998oO-"; 
    const QR_CODE_URL = "./wechat.png"; 

    let allGoods = [];
    let currentCategory = '全部';
    let cardSelectedOptions = {}; 
    let cart = [];
    let toastTimer = null;

    // Toast 轻提示组件
    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1500);
    }

    fetch('goods.json')
      .then(res => res.json())
      .then(data => {
        allGoods = data;
        allGoods.forEach(good => {
          cardSelectedOptions[good.id] = {};
          if (good.options && good.options.length > 0) {
            good.options.forEach(opt => {
              const firstVal = typeof opt.values[0] === 'object' ? opt.values[0].name : opt.values[0];
              cardSelectedOptions[good.id][opt.name] = firstVal;
            });
          }
        });
        renderCategories();
        renderGoods();
      })
      .catch(err => {
        console.error("数据加载出错:", err);
      });

    function renderCategories() {
      const categories = ['全部', ...new Set(allGoods.map(item => item.category))];
      document.getElementById('categoryBar').innerHTML = categories.map(cat => `
        <div class="category-item ${cat === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</div>
      `).join('');
    }

    function renderGoods() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const list = document.getElementById('goodsList');

      const filtered = allGoods.filter(item => {
        const matchCategory = currentCategory === '全部' || item.category === currentCategory;
        const matchSearch = item.title.toLowerCase().includes(keyword) || (item.desc && item.desc.toLowerCase().includes(keyword));
        return matchCategory && matchSearch;
      });

      if (filtered.length === 0) {
        list.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999; padding: 30px;">未找到商品</p>';
        return;
      }

      list.innerHTML = filtered.map(good => {
        const selectedSpecs = cardSelectedOptions[good.id] || {};
        const displayPrice = getDynamicPrice(good, selectedSpecs);

        let specHtml = '';
        if (good.options && good.options.length > 0) {
          specHtml = `<div class="card-spec-section">` + good.options.map(opt => `
            <div class="card-spec-group" data-opt-name="${opt.name}">
              <div class="card-spec-title">${opt.name}:</div>
              <div class="card-spec-items">
                ${opt.values.map(val => {
                  const valName = typeof val === 'object' ? val.name : val;
                  const isSelected = selectedSpecs[opt.name] === valName;
                  return `<button class="card-spec-btn ${isSelected ? 'selected' : ''}" onclick="event.stopPropagation(); changeCardSpec(this, ${good.id}, '${opt.name}', '${valName}')">${valName}</button>`;
                }).join('')}
              </div>
            </div>
          `).join('') + `</div>`;
        }

        return `
          <div class="goods-card" id="goods-card-${good.id}">
            <img class="goods-img" src="${good.image}" alt="${good.title}">
            <div class="goods-info">
              <div>
                <div class="goods-title">${good.title}</div>
                <div class="goods-price">${displayPrice}</div>
                ${specHtml}
              </div>
              <div class="card-actions">
                <button class="btn-cart" onclick="addCardToCart(${good.id})">+ 清单</button>
                <button class="btn-buy" onclick="buyCardNow(${good.id})">购买</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function changeCardSpec(btnEl, goodId, specName, valName) {
      cardSelectedOptions[goodId][specName] = valName;
      
      const cardEl = document.getElementById(`goods-card-${goodId}`);
      if (!cardEl) return;

      const groupEl = btnEl.closest('.card-spec-group');
      if (groupEl) {
        groupEl.querySelectorAll('.card-spec-btn').forEach(btn => btn.classList.remove('selected'));
        btnEl.classList.add('selected');
      }

      const good = allGoods.find(g => g.id === goodId);
      const newPrice = getDynamicPrice(good, cardSelectedOptions[goodId]);
      const priceEl = cardEl.querySelector('.goods-price');
      if (priceEl) {
        priceEl.innerText = newPrice;
      }
    }

    function getDynamicPrice(good, selectedSpecs) {
      if (!good.options) return good.price;
      for (let opt of good.options) {
        for (let val of opt.values) {
          if (typeof val === 'object' && selectedSpecs[opt.name] === val.name && val.price) {
            return `￥${val.price}`;
          }
        }
      }
      return good.price;
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderGoods();
    }

    function filterGoods() {
      renderGoods();
    }

    // 支持 isSilent 选项，决定是否跳出飘字提示
    function addCardToCart(goodId, isSilent = false) {
      const good = allGoods.find(g => g.id === goodId);
      const selectedSpecs = cardSelectedOptions[goodId] || {};
      const specText = Object.keys(selectedSpecs).length > 0 
        ? Object.entries(selectedSpecs).map(([k, v]) => `${k}:${v}`).join('; ') 
        : '标准规格';
      const price = getDynamicPrice(good, selectedSpecs);

      const exist = cart.find(item => item.good.id === good.id && item.specText === specText);
      if (exist) {
        exist.qty += 1;
      } else {
        cart.push({ good, specText, price, qty: 1 });
      }

      updateCartBadge();
      if (!isSilent) {
        showToast(`已添加：${good.title}`);
      }
    }

    function buyCardNow(goodId) {
      addCardToCart(goodId, true); // 静默加入清单
      openCartModal(); // 直接展开清单列表
    }

    function updateCartBadge() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartBadge').innerText = totalCount;
    }

    function openCartModal() {
      renderCartItems();
      document.getElementById('cartModal').classList.add('active');
    }

    function parseNumberPrice(priceStr) {
      if (!priceStr) return 0;
      const match = priceStr.match(/\d+(\.\d+)?/);
      return match ? parseFloat(match[0]) : 0;
    }

    function renderCartItems() {
      const container = document.getElementById('cartItemsList');
      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">清单为空</p>';
        document.getElementById('cartTotalPrice').innerText = '￥0';
        return;
      }

      let total = 0;
      container.innerHTML = cart.map((item, idx) => {
        const numPrice = parseNumberPrice(item.price);
        total += numPrice * item.qty;

        return `
          <div class="cart-item">
            <div>
              <div class="cart-item-title">${item.good.title}</div>
              <div class="cart-item-spec">${item.specText}</div>
              <div class="cart-item-price">${item.price}</div>
            </div>
            <div class="cart-item-control">
              <button class="btn-qty" onclick="changeQty(${idx}, -1)">-</button>
              <span>${item.qty}</span>
              <button class="btn-qty" onclick="changeQty(${idx}, 1)">+</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cartTotalPrice').innerText = `￥${total.toFixed(2)}`;
    }

    function changeQty(idx, change) {
      cart[idx].qty += change;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      updateCartBadge();
      renderCartItems();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function submitCartOrder() {
      if (cart.length === 0) {
        showToast('清单为空，请先选择商品');
        return;
      }

      let orderText = `【The Here Store 选购清单】\n------------------\n`;
      let total = 0;

      cart.forEach((item, i) => {
        orderText += `${i + 1}. ${item.good.title}\n   规格: ${item.specText}\n   价格: ${item.price} x ${item.qty}件\n`;
        total += parseNumberPrice(item.price) * item.qty;
      });

      orderText += `------------------\n预估总计：￥${total.toFixed(2)}\n\n请确认是否有货，谢谢！`;

      navigator.clipboard.writeText(orderText).then(() => {
        closeModal('cartModal');
        document.getElementById('wechatIdText').innerText = WECHAT_ID;
        document.getElementById('ownerQr').src = QR_CODE_URL;
        document.getElementById('qrModal').classList.add('active');
        showToast('订单已复制到剪贴板！');
      }).catch(() => {
        closeModal('cartModal');
        document.getElementById('wechatIdText').innerText = WECHAT_ID;
        document.getElementById('ownerQr').src = QR_CODE_URL;
        document.getElementById('qrModal').classList.add('active');
      });
    }
  </script>
</body>
</html>
